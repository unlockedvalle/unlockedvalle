<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Unlocked VALLE</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- GSAP for animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(45deg, #4f46e5, #7c3aed, #db2777, #f59e0b);
      background-size: 400%;
      animation: gradientShift 15s ease infinite;
      overflow: hidden;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      opacity: 0;
    }
    .content {
      max-width: 600px;
      padding: 2rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 1rem;
      backdrop-filter: blur(10px);
    }
    h1 {
      text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }
    p {
      line-height: 1.6;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white">
  <div class="content text-center">
    <h1 class="text-7xl md:text-9xl font-extrabold mb-6 tracking-tight">404</h1>
    <h2 class="text-3xl md:text-5xl font-semibold mb-8">¡Adiós, Unlocked VALLE!</h2>
    <p class="text-xl md:text-2xl max-w-md mx-auto">
      Lo sentimos, pero la página que buscas no existe. Unlocked VALLE, tu lugar favorito para juegos en clase, ha cerrado sus puertas para siempre. ¡Gracias por las risas y los momentos épicos!
    </p>
  </div>

  <script>
    // GSAP Animations
    gsap.from("h1", { 
      duration: 1.2, 
      y: -100, 
      opacity: 0, 
      ease: "bounce.out" 
    });
    gsap.from("h2", { 
      duration: 1, 
      delay: 0.3, 
      y: -50, 
      opacity: 0, 
      ease: "power3.out" 
    });
    gsap.from("p", { 
      duration: 1, 
      delay: 0.6, 
      opacity: 0, 
      scale: 0.9, 
      ease: "power3.out" 
    });

    // Enhanced sparkle effect
    function createSparkle() {
      const sparkle = document.createElement("div");
      sparkle.classList.add("sparkle");
      document.body.appendChild(sparkle);
      
      const size = Math.random() * 8 + 4;
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight;

      gsap.set(sparkle, { 
        left: x, 
        top: y, 
        width: size, 
        height: size 
      });

      gsap.to(sparkle, {
        scale: 1.5,
        opacity: 1,
        duration: 0.6,
        ease: "power2.out",
        onComplete: () => {
          gsap.to(sparkle, {
            scale: 0,
            opacity: 0,
            duration: 0.4,
            ease: "power2.in",
            onComplete: () => sparkle.remove()
          });
        }
      });
    }

    setInterval(createSparkle, 200);
  </script>
</body>
</html>
