<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resuelve tu Pyraminx</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .pyraminx-input, .instructions {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .face {
            display: inline-block;
            position: relative;
            width: 120px;
            height: 104px; /* Aproximado para triángulo equilátero */
            margin: 10px;
        }
        .sticker {
            position: absolute;
            cursor: pointer;
        }
        .center { /* Centro */
            width: 20px;
            height: 20px;
            background: #ccc;
            left: 50px;
            top: 44px;
            transform: translate(-50%, -50%);
        }
        .edge1 { /* Borde superior */
            width: 20px;
            height: 20px;
            left: 50px;
            top: 20px;
            transform: translate(-50%, -50%);
        }
        .edge2 { /* Borde inferior izquierda */
            width: 20px;
            height: 20px;
            left: 30px;
            top: 64px;
            transform: translate(-50%, -50%);
        }
        .edge3 { /* Borde inferior derecha */
            width: 20px;
            height: 20px;
            left: 70px;
            top: 64px;
            transform: translate(-50%, -50%);
        }
        .edge4 { /* Borde superior (segundo) */
            width: 20px;
            height: 20px;
            left: 50px;
            top: 10px;
            transform: translate(-50%, -50%);
        }
        .corner1 { /* Esquina superior */
            width: 20px;
            height: 20px;
            left: 50px;
            top: 0px;
            transform: translate(-50%, -50%);
        }
        .corner2 { /* Esquina inferior izquierda */
            width: 20px;
            height: 20px;
            left: 20px;
            top: 84px;
            transform: translate(-50%, -50%);
        }
        .corner3 { /* Esquina inferior derecha */
            width: 20px;
            height: 20px;
            left: 80px;
            top: 84px;
            transform: translate(-50%, -50%);
        }
        .corner4 { /* Esquina superior (segunda) */
            width: 20px;
            height: 20px;
            left: 60px;
            top: 20px;
            transform: translate(-50%, -50%);
        }
        .color-picker {
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #0056b3;
        }
        select {
            padding: 5px;
            margin: 5px;
        }
        .color-btn {
            width: 30px;
            height: 30px;
            border: 1px solid #333;
        }
        .selected-color {
            border: 3px solid #000;
        }
        .animating {
            animation: rotate 1s ease-in-out;
        }
        @keyframes rotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(120deg); }
        }
        #current-step {
            font-size: 18px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Resuelve tu Pyraminx</h1>
    <div class="container">
        <!-- Sección para pintar el Pyraminx -->
        <div class="pyraminx-input">
            <h2>Pinta tu Pyraminx</h2>
            <label>Selecciona la cara:</label>
            <select id="face-selector">
                <option value="F">Frente (Verde)</option>
                <option value="R">Derecha (Rojo)</option>
                <option value="L">Izquierda (Azul)</option>
                <option value="D">Abajo (Amarillo)</option>
            </select>
            <div class="color-picker">
                <label>Selecciona color:</label>
                <button class="color-btn" style="background-color: #00ff00;" data-color="G"></button>
                <button class="color-btn" style="background-color: #ff0000;" data-color="R"></button>
                <button class="color-btn" style="background-color: #0000ff;" data-color="B"></button>
                <button class="color-btn" style="background-color: #ffff00;" data-color="Y"></button>
            </div>
            <div id="pyraminx-face" class="face"></div>
            <button id="solve-btn" disabled>Resolver Pyraminx</button>
        </div>
        <!-- Sección de instrucciones -->
        <div class="instructions">
            <h2>Instrucciones</h2>
            <p id="current-step">Pinta todas las caras del Pyraminx primero.</p>
            <div id="animation-face" class="face"></div>
            <button id="next-step" disabled>Siguiente Paso</button>
            <button id="prev-step" disabled>Paso Anterior</button>
        </div>
    </div>
    <script>
        // Estado inicial del Pyraminx (4 caras, 9 stickers por cara: 1 centro, 4 bordes, 4 esquinas)
        let pyraminxState = {
            F: ['G', 'G', 'G', 'G', 'G', 'G', 'G', 'G', 'G'], // Frente (verde)
            R: ['R', 'R', 'R', 'R', 'R', 'R', 'R', 'R', 'R'], // Derecha (rojo)
            L: ['B', 'B', 'B', 'B', 'B', 'B', 'B', 'B', 'B'], // Izquierda (azul)
            D: ['Y', 'Y', 'Y', 'Y', 'Y', 'Y', 'Y', 'Y', 'Y']  // Abajo (amarillo)
        };
        let selectedFace = 'F';
        let selectedColor = 'G';
        let solutionSteps = [];
        let currentStepIndex = 0;

        // Elementos del DOM
        const faceSelector = document.getElementById('face-selector');
        const pyraminxFaceDiv = document.getElementById('pyraminx-face');
        const animationFaceDiv = document.getElementById('animation-face');
        const colorButtons = document.querySelectorAll('.color-btn');
        const solveBtn = document.getElementById('solve-btn');
        const currentStepP = document.getElementById('current-step');
        const nextStepBtn = document.getElementById('next-step');
        const prevStepBtn = document.getElementById('prev-step');

        // Inicializar cara
        renderFace();

        // Cambiar de cara
        faceSelector.addEventListener('change', () => {
            selectedFace = faceSelector.value;
            renderFace();
            checkAllFacesFilled();
        });

        // Seleccionar color
        colorButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                selectedColor = btn.dataset.color;
                colorButtons.forEach(b => b.classList.remove('selected-color'));
                btn.classList.add('selected-color');
            });
            // Seleccionar el primer color por defecto
            if (btn.dataset.color === 'G') btn.classList.add('selected-color');
        });

        // Renderizar cara actual
        function renderFace() {
            pyraminxFaceDiv.innerHTML = '';
            const classes = ['center', 'edge1', 'edge2', 'edge3', 'edge4', 'corner1', 'corner2', 'corner3', 'corner4'];
            pyraminxState[selectedFace].forEach((color, index) => {
                const sticker = document.createElement('div');
                sticker.className = `sticker ${classes[index]}`;
                sticker.style.backgroundColor = getColorHex(color);
                sticker.addEventListener('click', () => {
                    pyraminxState[selectedFace][index] = selectedColor;
                    sticker.style.backgroundColor = getColorHex(selectedColor);
                    checkAllFacesFilled();
                });
                pyraminxFaceDiv.appendChild(sticker);
            });
        }

        // Convertir color a hexadecimal
        function getColorHex(color) {
            const colors = {
                G: '#00ff00', // Verde
                R: '#ff0000', // Rojo
                B: '#0000ff', // Azul
                Y: '#ffff00'  // Amarillo
            };
            return colors[color];
        }

        // Verificar si todas las caras están completas
        function checkAllFacesFilled() {
            const allFilled = Object.values(pyraminxState).every(face => 
                face.every(color => ['G', 'R', 'B', 'Y'].includes(color))
            );
            solveBtn.disabled = !allFilled;
        }

        // Resolver Pyraminx (simulación)
        solveBtn.addEventListener('click', () => {
            // Simulación de pasos (en un caso real, usar algoritmo LBL)
            solutionSteps = [
                { face: 'F', type: 'tip', direction: 'clockwise', description: 'Gira la punta frontal en sentido horario' },
                { face: 'R', type: 'face', direction: 'clockwise', description: 'Gira la cara derecha en sentido horario' },
                { face: 'L', type: 'tip', direction: 'counterclockwise', description: 'Gira la punta izquierda en sentido antihorario' },
                { face: 'D', type: 'face', direction: 'clockwise', description: 'Gira la cara inferior en sentido horario' }
            ];
            currentStepIndex = 0;
            showStep();
            solveBtn.disabled = true;
            nextStepBtn.disabled = false;
            prevStepBtn.disabled = true;
        });

        // Mostrar paso actual con animación
        function showStep() {
            if (currentStepIndex < solutionSteps.length) {
                const step = solutionSteps[currentStepIndex];
                currentStepP.textContent = `Paso ${currentStepIndex + 1}: ${step.description}`;
                animateStep(step);
                nextStepBtn.disabled = currentStepIndex === solutionSteps.length - 1;
                prevStepBtn.disabled = currentStepIndex === 0;
            } else {
                currentStepP.textContent = '¡Pyraminx resuelto!';
                animationFaceDiv.innerHTML = '';
                nextStepBtn.disabled = true;
            }
        }

        // Animar paso
        function animateStep(step) {
            animationFaceDiv.innerHTML = '';
            const classes = ['center', 'edge1', 'edge2', 'edge3', 'edge4', 'corner1', 'corner2', 'corner3', 'corner4'];
            const faceState = [...pyraminxState[step.face]]; // Copia del estado actual
            // Simular giro (en un caso real, actualizar estado según algoritmo)
            if (step.type === 'tip') {
                // Girar solo la esquina (índices 5, 6, 7, 8)
                if (step.direction === 'clockwise') {
                    [faceState[5], faceState[6], faceState[7]] = [faceState[7], faceState[5], faceState[6]];
                } else {
                    [faceState[5], faceState[6], faceState[7]] = [faceState[6], faceState[7], faceState[5]];
                }
            } else {
                // Girar toda la cara
                if (step.direction === 'clockwise') {
                    [faceState[1], faceState[2], faceState[3], faceState[5], faceState[6], faceState[7]] = 
                    [faceState[3], faceState[1], faceState[2], faceState[7], faceState[5], faceState[6]];
                } else {
                    [faceState[1], faceState[2], faceState[3], faceState[5], faceState[6], faceState[7]] = 
                    [faceState[2], faceState[3], faceState[1], faceState[6], faceState[7], faceState[5]];
                }
            }
            // Mostrar cara animada
            faceState.forEach((color, index) => {
                const sticker = document.createElement('div');
                sticker.className = `sticker ${classes[index]} ${step.type === 'tip' && index < 5 ? '' : 'animating'}`;
                sticker.style.backgroundColor = getColorHex(color);
                animationFaceDiv.appendChild(sticker);
            });
            // Actualizar estado (simulado, solo para la cara mostrada)
            pyraminxState[step.face] = faceState;
        }

        // Navegar entre pasos
        nextStepBtn.addEventListener('click', () => {
            if (currentStepIndex < solutionSteps.length) {
                currentStepIndex++;
                showStep();
            }
        });

        prevStepBtn.addEventListener('click', () => {
            if (currentStepIndex > 0) {
                currentStepIndex--;
                showStep();
            }
        });
    </script>
</body>
</html>
